<!doctype html>
<meta charset="utf-8">
<title>REF-1.1 S2.0c — tombstone heap (real browser)</title>
<body style="font:14px ui-monospace,monospace;padding:1rem;white-space:pre-wrap">
<div id="out">measuring…</div>
<script>
// REF-1.1 S2.0c Gate A — real in-browser tombstone-store heap measurement.
// Companion to REF-1.1-S2.0c-Tombstone-Saturation-Sim.mjs (which measures in Node).
// Aster Gate A: the browser figure must come from a real browser runtime, not a Node
// process. This builds the same retained tombstone record + Map and reads
// performance.memory.usedJSHeapSize (Chromium). No --expose-gc in the pane, so we build
// a large N (delta dominates noise), settle briefly, and report per-entry + variance.

const enc = new TextEncoder();
function hex(nBytes) {
  const b = new Uint8Array(nBytes); crypto.getRandomValues(b);
  let s = ''; for (const x of b) s += x.toString(16).padStart(2, '0'); return s;
}
const newTopicId = () => hex(33), newMsgId = () => hex(32), newSigner = () => hex(32);
const newSig = () => 'ed25519:' + hex(64);
const KILL_DOMAIN = 'axona:pubsub-kill:v1';
function canonical(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(canonical).join(',') + ']';
  return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canonical(v[k])).join(',') + '}';
}
function killBytes(t, m, s, now) { return canonical({ d: KILL_DOMAIN, topicId: t, msgId: m, ts: now - 1000, seq: 1, signature: newSig(), signerPubkey: s }); }

// Build the COMPLETE deletion state at v11's proposed browser caps, REPRESENTATION-EQUIVALENT
// to -Sim.mjs: every retained record carries `_bytes`; each store carries its total bytes +
// count; the tombstone store carries its `minDeath` reclaim-guard field; both carry perSigner +
// perTopic accounting Maps. This is what the kernel structures actually hold, so the heap number
// is faithful — not an under-count.
const TOMB_N = 2048, CAND_N = 512;
const TTL_CEILING = 86400000, CLOCK_SKEW = 5000, FUTURE_TOLERANCE_MS = 30000;
function canonicalBytes(s) { return enc.encode(s).length; }
function recBytes(k, rec) { return canonicalBytes(k) + canonicalBytes(canonical(rec)); }
function fillTrial() {
  const now = 3e12;
  // Tombstone store: same fields as TombstoneStore (map, bytes, perSigner, perTopic, minDeath).
  const tomb = { map: new Map(), bytes: 0, perSigner: new Map(), perTopic: new Map(), minDeath: Infinity };
  // Candidate store: same fields as CandidateStore (map of lists, total, bytes, perSigner, perTopic).
  const cand = { map: new Map(), total: 0, bytes: 0, perSigner: new Map(), perTopic: new Map() };
  const inc = (m, k) => m.set(k, (m.get(k) || 0) + 1);
  for (let i = 0; i < TOMB_N; i++) {
    const t = newTopicId(), m = newMsgId(), s = newSigner(), k = t + '|' + m;
    const ed = now + TTL_CEILING;
    const rec = { signerPubkey: s, effectiveDeath: ed, killBytes: killBytes(t, m, s, now) };
    rec._bytes = recBytes(k, { signerPubkey: rec.signerPubkey, effectiveDeath: rec.effectiveDeath, killBytes: rec.killBytes });
    tomb.map.set(k, rec); tomb.bytes += rec._bytes; if (ed < tomb.minDeath) tomb.minDeath = ed; inc(tomb.perSigner, s); inc(tomb.perTopic, t);
  }
  for (let i = 0; i < CAND_N; i++) {
    const t = newTopicId(), m = newMsgId(), s = newSigner(), k = t + '|' + m;
    const c = { signer: s, killBytes: killBytes(t, m, s, now), tag: 'pending', bodyArrivedAt: now, claimRet: now + FUTURE_TOLERANCE_MS + TTL_CEILING + CLOCK_SKEW };
    c._bytes = recBytes(k, { signer: c.signer, killBytes: c.killBytes });
    cand.map.set(k, [c]); cand.total++; cand.bytes += c._bytes; inc(cand.perSigner, s); inc(cand.perTopic, t);
  }
  return { tomb, cand };   // retain the whole representation-equivalent state
}

async function run() {
  const out = document.getElementById('out');
  if (!performance.memory) { out.textContent = 'performance.memory unavailable (non-Chromium). Cannot measure heap here.'; window.__result = { error: 'no performance.memory', ua: navigator.userAgent }; return; }
  const COMBINED = TOMB_N + CAND_N;    // the complete deletion state at v11 browser caps (2048 + 512)
  const NEED = 6;                      // Aster: >= 6 FRESH contexts, one measured fill each
  // ONE measured fill in THIS fresh context. Each page load is a fresh context; samples are
  // aggregated across loads via localStorage. Operator procedure: reload this page (or open a
  // new tab) NEED times on the real target browser build; the aggregate reports when NEED is
  // reached. (An external runner — e.g. puppeteer launching NEED fresh pages — is equivalent.)
  await new Promise(r => setTimeout(r, 300));
  const before = performance.memory.usedJSHeapSize;
  window.__state = fillTrial();        // retained on window for this context's lifetime
  await new Promise(r => setTimeout(r, 300));
  const after = performance.memory.usedJSHeapSize;
  const perEntry = (after - before) / COMBINED;
  const pinned = perEntry === 0 && performance.memory.usedJSHeapSize === after;
  // Accumulate fresh-context samples.
  let samples = [];
  try { samples = JSON.parse(localStorage.getItem('ref11_ctx_samples') || '[]'); } catch {}
  samples.push({ perEntry: Math.round(perEntry), usedJSHeapSize: performance.memory.usedJSHeapSize, at: Date.now() });
  try { localStorage.setItem('ref11_ctx_samples', JSON.stringify(samples)); } catch {}
  const vals = samples.map(s => s.perEntry);
  const mean = vals.reduce((a, b) => a + b, 0) / vals.length, max = Math.max(...vals);
  const sd = Math.sqrt(vals.reduce((a, b) => a + (b - mean) ** 2, 0) / vals.length);
  window.__result = {
    engine: 'chromium', ua: navigator.userAgent, tombN: TOMB_N, candN: CAND_N, combined: COMBINED,
    thisContextPerEntry: Math.round(perEntry), usedJSHeapSize: performance.memory.usedJSHeapSize,
    freshContexts: samples.length, need: NEED,
    aggregate: samples.length >= NEED ? { mean: Math.round(mean), sd: Math.round(sd), max: Math.round(max) } : null,
    status: pinned
      ? 'UNAVAILABLE — performance.memory appears pinned/quantized (zero delta); run on a browser build with --enable-precise-memory-info, or use measureUserAgentSpecificMemory() under cross-origin isolation'
      : (samples.length >= NEED ? 'ok — worst-case max governs sizing' : `collecting: reload this page ${NEED - samples.length} more time(s) for fresh contexts (localStorage.removeItem('ref11_ctx_samples') to reset)`),
    note: 'one measured fill per fresh context (page load); no --expose-gc in pane; references retained on window.__state',
  };
  out.textContent = 'DONE\n' + JSON.stringify(window.__result, null, 2);
  keep.length;                         // reference keep so it is not optimised away
}
run();
</script>
</body>
