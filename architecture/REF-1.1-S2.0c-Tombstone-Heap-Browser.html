<!doctype html>
<meta charset="utf-8">
<title>REF-1.1 S2.0c — tombstone heap (real browser)</title>
<body style="font:14px ui-monospace,monospace;padding:1rem;white-space:pre-wrap">
<div id="out">measuring…</div>
<script>
// REF-1.1 S2.0c Gate A — real in-browser tombstone-store heap measurement.
// Companion to REF-1.1-S2.0c-Tombstone-Saturation-Sim.mjs (which measures in Node).
// Aster Gate A: the browser figure must come from a real browser runtime, not a Node
// process. This builds the same retained tombstone record + Map and reads
// performance.memory.usedJSHeapSize (Chromium). No --expose-gc in the pane, so we build
// a large N (delta dominates noise), settle briefly, and report per-entry + variance.

const enc = new TextEncoder();
function hex(nBytes) {
  const b = new Uint8Array(nBytes); crypto.getRandomValues(b);
  let s = ''; for (const x of b) s += x.toString(16).padStart(2, '0'); return s;
}
const newTopicId = () => hex(33), newMsgId = () => hex(32), newSigner = () => hex(32);
const newSig = () => 'ed25519:' + hex(64);
const KILL_DOMAIN = 'axona:pubsub-kill:v1';
function canonical(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(canonical).join(',') + ']';
  return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canonical(v[k])).join(',') + '}';
}
function killBytes(t, m, s, now) { return canonical({ d: KILL_DOMAIN, topicId: t, msgId: m, ts: now - 1000, seq: 1, signature: newSig(), signerPubkey: s }); }

// Build the COMPLETE deletion state at v11's proposed browser caps, REPRESENTATION-EQUIVALENT
// to -Sim.mjs: every retained record carries `_bytes`; each store carries its total bytes +
// count; the tombstone store carries its `minDeath` reclaim-guard field; both carry perSigner +
// perTopic accounting Maps. This is what the kernel structures actually hold, so the heap number
// is faithful — not an under-count.
const TOMB_N = 2048, CAND_N = 512;
const TTL_CEILING = 86400000, CLOCK_SKEW = 5000, FUTURE_TOLERANCE_MS = 30000;
function canonicalBytes(s) { return enc.encode(s).length; }
function recBytes(k, rec) { return canonicalBytes(k) + canonicalBytes(canonical(rec)); }
const RECORD_MAX = 768, SUBLIMIT = 16;
function fillTrial() {
  const now = 3e12;
  // Tombstone store: EXACT field parity with Node TombstoneStore, incl. the retained cap/config
  // fields (maxCount, maxBytes, perSignerMax, perTopicMax) and the minDeath reclaim guard.
  const tomb = { maxCount: TOMB_N, maxBytes: TOMB_N * RECORD_MAX, perSignerMax: TOMB_N / SUBLIMIT, perTopicMax: TOMB_N / SUBLIMIT,
    map: new Map(), bytes: 0, perSigner: new Map(), perTopic: new Map(), minDeath: Infinity };
  // Candidate store: EXACT field parity with Node CandidateStore (max, maxBytes, perSignerMax, perTopicMax).
  const cand = { max: CAND_N, maxBytes: CAND_N * RECORD_MAX, perSignerMax: CAND_N / SUBLIMIT, perTopicMax: CAND_N / SUBLIMIT,
    map: new Map(), total: 0, bytes: 0, perSigner: new Map(), perTopic: new Map() };
  const inc = (m, k) => m.set(k, (m.get(k) || 0) + 1);
  for (let i = 0; i < TOMB_N; i++) {
    const t = newTopicId(), m = newMsgId(), s = newSigner(), k = t + '|' + m;
    const ed = now + TTL_CEILING;
    const rec = { signerPubkey: s, effectiveDeath: ed, killBytes: killBytes(t, m, s, now) };
    rec._bytes = recBytes(k, { signerPubkey: rec.signerPubkey, effectiveDeath: rec.effectiveDeath, killBytes: rec.killBytes });
    tomb.map.set(k, rec); tomb.bytes += rec._bytes; if (ed < tomb.minDeath) tomb.minDeath = ed; inc(tomb.perSigner, s); inc(tomb.perTopic, t);
  }
  for (let i = 0; i < CAND_N; i++) {
    const t = newTopicId(), m = newMsgId(), s = newSigner(), k = t + '|' + m;
    const c = { signer: s, killBytes: killBytes(t, m, s, now), tag: 'pending', bodyArrivedAt: now, claimRet: now + FUTURE_TOLERANCE_MS + TTL_CEILING + CLOCK_SKEW };
    c._bytes = recBytes(k, { signer: c.signer, killBytes: c.killBytes });
    cand.map.set(k, [c]); cand.total++; cand.bytes += c._bytes; inc(cand.perSigner, s); inc(cand.perTopic, t);
  }
  return { tomb, cand };   // retain the whole representation-equivalent state
}

async function run() {
  const out = document.getElementById('out');
  if (!performance.memory) { out.textContent = 'performance.memory unavailable (non-Chromium). Cannot measure heap here.'; window.__result = { error: 'no performance.memory', ua: navigator.userAgent }; return; }
  const COMBINED = TOMB_N + CAND_N;    // the complete deletion state at v11 browser caps (2048 + 512)
  const NEED = 6;                      // Aster: >= 6 FRESH contexts, one measured fill each
  // ONE measured fill in THIS fresh context. Each page load is a fresh context; samples are
  // aggregated across loads via localStorage. Operator procedure: reload this page (or open a
  // new tab) NEED times on the real target browser build; the aggregate reports when NEED is
  // reached. (An external runner — e.g. puppeteer launching NEED fresh pages — is equivalent.)
  await new Promise(r => setTimeout(r, 300));
  const before = performance.memory.usedJSHeapSize;
  window.__state = fillTrial();        // retained on window for this context's lifetime
  await new Promise(r => setTimeout(r, 300));
  const after = performance.memory.usedJSHeapSize;
  const perEntry = (after - before) / COMBINED;
  const pinned = perEntry === 0 && performance.memory.usedJSHeapSize === after;
  // Accumulate fresh-context samples.
  // Isolation: every measurement campaign needs an explicit unique RUN ID plus an operator-supplied
  // measurement MODE (flag profile — e.g. precise-memory / coi / default), because the UA does not
  // change when --enable-precise-memory-info is set. Supply both on the URL:
  //     ...Heap-Browser.html?run=<campaign-id>&mode=<flag-profile>
  // A different run= starts a fresh bag at zero; six VALID samples must accrue under that exact
  // run ID + fingerprint. Bump HARNESS_VERSION whenever the representation changes.
  const HARNESS_VERSION = 'v4';
  const q = new URLSearchParams(location.search);
  const runId = q.get('run'), mode = q.get('mode');
  const fp = `${HARNESS_VERSION}|run=${runId}|mode=${mode}|${navigator.userAgent}|tomb=${TOMB_N}|cand=${CAND_N}|rec=${RECORD_MAX}`;
  const isValid = perEntry > 0 && !pinned;
  const store = runId ? `ref11_ctx_samples__${runId}` : null;   // run ID is part of the storage key
  let bag = { fp, samples: [] }, storeError = null;
  if (store) {
    try { const raw = JSON.parse(localStorage.getItem(store) || 'null'); if (raw && raw.fp === fp) bag = raw; } catch {}
    if (isValid) {
      bag.samples.push({ perEntry: Math.round(perEntry), before, after, usedJSHeapSize: performance.memory.usedJSHeapSize });
      try { localStorage.setItem(store, JSON.stringify(bag)); const chk = localStorage.getItem(store); if (chk !== JSON.stringify(bag)) storeError = 'readback mismatch'; }
      catch (e) { storeError = String(e && e.message || e); bag.samples.pop(); }   // don't claim a sample we couldn't persist
    }
  }
  const vals = bag.samples.map(s => s.perEntry);
  const mean = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
  const max = vals.length ? Math.max(...vals) : 0;
  const sd = vals.length ? Math.sqrt(vals.reduce((a, b) => a + (b - mean) ** 2, 0) / vals.length) : 0;
  const enough = store && bag.samples.length >= NEED;
  window.__result = {
    engine: 'chromium', ua: navigator.userAgent, harness: HARNESS_VERSION, runId, mode, fingerprint: fp,
    tombN: TOMB_N, candN: CAND_N, combined: COMBINED,
    thisContext: { perEntry: Math.round(perEntry), before, after, usedJSHeapSize: performance.memory.usedJSHeapSize, valid: isValid },
    validSamplesThisRun: bag.samples.length, need: NEED, storeError,
    aggregate: enough ? { mean: Math.round(mean), sd: Math.round(sd), max: Math.round(max), sizeBy: 'worst-case max' } : null,
    status: !runId ? 'RUN ID REQUIRED — append ?run=<campaign-id>&mode=<flag-profile> to the URL; nothing is stored without it'
      : storeError ? `STORAGE FAILURE — sample NOT persisted (${storeError}); progress cannot be trusted`
      : pinned ? 'UNAVAILABLE — performance.memory pinned/quantized (zero delta); this sample is invalid and NOT stored. Run on a browser with --enable-precise-memory-info, or measureUserAgentSpecificMemory() under cross-origin isolation.'
      : enough ? 'ok — 6 valid fresh-context samples under this run ID; worst-case max governs sizing'
      : `collecting: ${NEED - bag.samples.length} more valid fresh-context sample(s) needed under run=${runId} — reload this page (localStorage.removeItem('${store}') to reset this run)`,
    completed: true,
    note: 'one measured fill per fresh context (page load); invalid (pinned/zero/negative) excluded; run-ID + fingerprint scoped; raw before/after retained; storage failures surfaced; references on window.__state',
  };
  out.textContent = 'DONE\n' + JSON.stringify(window.__result, null, 2);
}
run().catch(e => {   // require a clean, exception-free completion; surface any error instead of throwing
  const out = document.getElementById('out');
  window.__result = { completed: false, error: String(e && e.stack || e), ua: navigator.userAgent };
  if (out) out.textContent = 'ERROR\n' + JSON.stringify(window.__result, null, 2);
});
</script>
</body>
